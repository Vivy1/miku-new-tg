<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miku · 个人主页</title>
<meta name="description" content="Miku 的个人主页">
<meta name="theme-color" content="#39c5bb">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💠</text></svg>">
<style>
  :root{
    --bg:#f7f9fb; --card:#ffffff; --text:#1b2430; --muted:#6b7785;
    --line:#e6ebf1; --accent:#39c5bb; --accent-2:#f47fa6;
    --shadow:0 10px 30px rgba(27,36,48,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#161b22; --text:#e7edf5; --muted:#98a4b3;
      --line:#242c37; --shadow:0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7; display:flex; justify-content:center; padding:32px 20px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:720px}

  /* 头部 */
  .hero{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .avatar{
    width:76px;height:76px;flex:0 0 76px;border-radius:24px;
    display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 24px rgba(57,197,187,.35);
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce){.avatar{animation:none}}
  h1{font-size:28px;letter-spacing:.5px;line-height:1.3}
  .tagline{color:var(--muted);font-size:14px;margin-top:2px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}

  /* 卡片 */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:22px 24px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card h2{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:1.5px;
    text-transform:uppercase;margin-bottom:14px}
  .card p{font-size:15px}
  .card p + p{margin-top:10px}

  /* 链接 */
  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .link{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
    border:1px solid var(--line); color:var(--text); text-decoration:none; font-size:14px;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .link:hover{transform:translateY(-2px);border-color:var(--accent);background:rgba(57,197,187,.07)}
  .link .ico{font-size:17px;line-height:1}
  .link small{display:block;color:var(--muted);font-size:12px;line-height:1.4}

  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:28px}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line)}
  footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="avatar">M</div>
    <div>
      <h1>Miku</h1>
      <div class="tagline"><span class="dot"></span>写点东西，放点东西，偶尔折腾。</div>
    </div>
  </header>

  <section class="card">
    <h2>关于</h2>
    <p>你好，我是 Miku。这里是我的个人主页，正在慢慢建设。</p>
    <p>平时喜欢折腾域名、静态站点和一些小工具，喜欢把简单的事情做得干净一点。</p>
  </section>

  <section class="card">
    <h2>找到我</h2>
    <div class="links">
      <a class="link" href="https://github.com/" target="_blank" rel="noopener">
        <span class="ico">⌘</span>
        <span>GitHub<small>代码与项目</small></span>
      </a>
      <a class="link" href="mailto:you@example.com">
        <span class="ico">✉</span>
        <span>邮箱<small>you@example.com</small></span>
      </a>
      <a class="link" href="#" onclick="return false">
        <span class="ico">✎</span>
        <span>博客<small>即将上线</small></span>
      </a>
    </div>
  </section>

  <footer>
    © <span id="y">2026</span> Miku · <a href="https://miku.new.tg">miku.new.tg</a>
  </footer>

</div>
<script>
  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
